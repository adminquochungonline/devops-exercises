---
# Mot "may dich" gia lap bang pod Ubuntu chay SSH server.
# Ansible se SSH vao day de cai package -> giong quan ly server that.
# CANH BAO: password 'ansible123' duoi day chi la mat khau LAB tam thoi.
# KHONG dung mau nay cho moi truong that - hay dung SSH key + Secret cua k8s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-node
  namespace: ansible
  labels:
    app: target-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-node
  template:
    metadata:
      labels:
        app: target-node
    spec:
      containers:
        - name: ubuntu-ssh
          image: ubuntu:22.04
          # Cai openssh-server + python3 (Ansible can python tren target), tao user 'ansible'
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server python3 sudo
              mkdir -p /var/run/sshd
              useradd -m -s /bin/bash ansible || true
              echo 'ansible:ansible123' | chpasswd
              echo 'ansible ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible
              sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
              /usr/sbin/sshd -D
          ports:
            - containerPort: 22
          readinessProbe:
            tcpSocket:
              port: 22
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: target-node
  namespace: ansible
spec:
  selector:
    app: target-node
  ports:
    - name: ssh
      port: 22
      targetPort: 22
