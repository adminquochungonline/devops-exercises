---
apiVersion: v1
kind: Namespace
metadata:
  name: ansible
---
# Pod Ansible control node chay nen tren k3s.
# Dung image cong dong 'cytopia/ansible' (co san ansible + tools), giu pod song bang sleep.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-control
  namespace: ansible
  labels:
    app: ansible-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-control
  template:
    metadata:
      labels:
        app: ansible-control
    spec:
      containers:
        - name: ansible
          image: alpine/ansible:latest
          command: ["sleep", "infinity"]
          workingDir: /workspace
          volumeMounts:
            - name: playbooks
              mountPath: /workspace
      volumes:
        - name: playbooks
          configMap:
            name: ansible-playbooks
